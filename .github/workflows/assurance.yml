name: Background assurance
on:
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:
permissions: {}
jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.98.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Native coverage (90% lines, background threshold)
        run: cargo llvm-cov --locked --fail-under-lines 90 --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: lcov.info

  report:
    if: always()
    needs: [coverage]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/evidence.py assurance
        env:
          EVIDENCE_DATA: '{"coverage":"${{ needs.coverage.result }}"}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: evidence-assurance
          path: evidence/
