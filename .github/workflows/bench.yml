name: Benchmarks
on:
  schedule:
    - cron: "29 3 * * 0"
  workflow_dispatch:
permissions: {}
jobs:
  bench:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.1"
      - run: cargo bench --locked --bench parsing
      - run: cargo build --release --locked
      - run: python3 tools/benchmark_fixture.py target/release/clisok
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: evidence-bench
          path: |
            evidence/
            target/criterion/
