name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  # Run on an existing tag with: gh workflow run release.yml --ref <tag>
  workflow_dispatch:

jobs:
  build:
    # A release needs a tag; dispatching on a branch would publish "main".
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name="binok-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          exe=binok; [ "${{ matrix.archive }}" = zip ] && exe=binok.exe
          cp "target/${{ matrix.target }}/release/$exe" README.md CHANGELOG.md "$name"/
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd "$name" && 7z a "../$name.zip" *)
          else
            tar -czf "$name.tar.gz" -C "$name" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: binok-*.${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v tag="$GITHUB_REF_NAME" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
