name: Release

on:
  push:
    tags: ["[0-9]*", "v[0-9]*"]
  workflow_dispatch:

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- local reusable workflow at the release SHA
    permissions:
      contents: read

  plan:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 tools/release_check.py tag "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build once from the locked inputs
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"
      - name: Package exact binaries with licenses and checksums
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: python tools/release_check.py package "$TAG" "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.target }}
          path: dist/

  smoke:
    needs: [plan, build]
    uses: ./.github/workflows/action-test.yml # zizmor: ignore[self-repository] -- local reusable workflow at the release SHA
    with:
      tag: ${{ needs.plan.outputs.tag }}
      version: ${{ needs.plan.outputs.version }}
    permissions:
      contents: read

  release:
    needs: [plan, smoke, ci]
    if: always() && needs.plan.result == 'success' && needs.smoke.result == 'success' && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release from the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          python3 tools/release_check.py manifest dist
          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          flags=()
          case "${VERSION%%+*}" in *-*) flags+=(--prerelease);; esac
          gh release create "$TAG" --target "$RELEASE_SHA" --title "$TAG" \
            --notes-file notes.md "${flags[@]}" dist/*
