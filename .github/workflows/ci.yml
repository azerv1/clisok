name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*", "v[0-9]*"]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Cache Rust dependencies and build outputs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] -- tag guard disables release cache reads; CI publishes no binaries
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: cargo-${{ runner.os }}-${{ runner.arch }}-quality-1.98.1-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # Clippy and native tests compile the crate; packaging need not compile it again.
      - name: Validate package contents
        run: |
          extra=()
          if [ "${ACT:-}" = true ]; then extra+=(--allow-dirty); fi
          cargo package --locked --no-verify "${extra[@]}"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # zizmor: ignore[cache-poisoning] -- tag guard disables release cache reads; CI publishes no binaries
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group dev
      - run: uv run --no-sync ruff check tools tests/release
      - run: uv run --no-sync mypy tools tests/release
      - run: uv run --no-sync pytest
      - run: uvx --with shellcheck-py==0.11.0.1 --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.30.1 --offline .github/workflows action.yml

  test:
    name: Native tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            toolchain: "1.98.1"
          - os: ubuntu-24.04
            toolchain: "1.98.1"
          - os: ubuntu-24.04
            toolchain: "1.88.0"
          - os: windows-2025
            toolchain: "1.88.0"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Cache Rust dependencies and build outputs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # zizmor: ignore[cache-poisoning] -- tag guard disables release cache reads; CI publishes no binaries
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/.rustc_info.json
          key: cargo-${{ runner.os }}-${{ runner.arch }}-test-${{ matrix.toolchain }}-${{ hashFiles('Cargo.lock') }}
      - run: rustc +${{ matrix.toolchain }} -V
      - run: cargo +${{ matrix.toolchain }} test --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock

  ci-ok:
    if: always()
    needs: [quality, test, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          for result in "$QUALITY" "$TEST" "$AUDIT"; do
            [ "$result" = success ] || { echo "::error::a required check failed"; exit 1; }
          done
