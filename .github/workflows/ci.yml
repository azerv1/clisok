name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]*", "v[0-9]*"]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo package --locked
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: false
      - run: uv sync --locked --group dev
      - run: uv run ruff check tools tests/release
      - run: uv run mypy tools tests/release
      - run: uv run pytest
      - run: uvx --with shellcheck-py==0.11.0.1 --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.30.1 --offline .github/workflows action.yml

  test:
    name: Native tests (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            toolchain: "1.98.1"
          - os: ubuntu-24.04
            toolchain: "1.98.1"
          - os: ubuntu-24.04
            toolchain: "1.88.0"
          - os: windows-2025
            toolchain: "1.88.0"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: rustc +${{ matrix.toolchain }} -V
      - run: cargo +${{ matrix.toolchain }} test --locked

  audit:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --deny warnings
      - run: cargo audit --deny warnings --file fuzz/Cargo.lock

  ci-ok:
    if: always()
    needs: [quality, test, audit]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          for result in "$QUALITY" "$TEST" "$AUDIT"; do
            [ "$result" = success ] || { echo "::error::a required check failed"; exit 1; }
          done
