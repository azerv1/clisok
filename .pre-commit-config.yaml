repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check tools tests/release
        language: system
        pass_filenames: false
        files: '^(tools/.*\.py|tests/release/.*\.py|pyproject\.toml|uv\.lock)$'

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy tools tests/release
        language: system
        pass_filenames: false
        files: '^(tools/.*\.py|tests/release/.*\.py|pyproject\.toml|uv\.lock)$'

      - id: zizmor
        name: zizmor
        entry: uvx zizmor==1.30.1 --offline
        language: system
        files: '^((\.github/workflows/.*\.ya?ml)|action\.yml)$'

      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|build\.rs|src/.*\.rs|tests/.*\.rs|examples/.*\.rs|benches/.*\.rs|fuzz/Cargo\.(toml|lock)|fuzz/.*\.rs)$'

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|build\.rs|src/.*\.rs|tests/.*\.rs|examples/.*\.rs|benches/.*\.rs|fuzz/Cargo\.(toml|lock)|fuzz/.*\.rs)$'

      - id: cargo-check
        name: cargo check
        entry: cargo check --all-targets --locked
        language: system
        pass_filenames: false
        files: '^(Cargo\.(toml|lock)|rust-toolchain\.toml|build\.rs|src/.*\.rs|tests/.*\.rs|examples/.*\.rs|benches/.*\.rs|fuzz/Cargo\.(toml|lock)|fuzz/.*\.rs)$'
