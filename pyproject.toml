[project]
name = "clisok-release-tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Local checks for the stdlib-only release helpers.
dev = ["pytest==8.4.2", "PyYAML==6.0.3", "types-PyYAML==6.0.12.20250915", "ruff==0.17.2", "mypy==1.18.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/release"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
