name: pathsok
description: Find broken PATH entries, dead launchers and shims, missing DLLs, and tools whose --help fails.
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: Release to use, e.g. 0.4.0. Defaults to the ref this action is used at, or the latest release.
    default: ''
  args:
    description: Arguments passed to pathsok, split on whitespace (e.g. "check --json --skip foo").
    default: check

runs:
  using: composite
  steps:
    - name: Download pathsok
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        case "$RUNNER_OS" in
          Linux) asset='pathsok-*-x86_64-unknown-linux-musl.tar.gz' ;;
          Windows) asset='pathsok-*-x86_64-pc-windows-msvc.zip' ;;
          *) echo "::error::pathsok has no $RUNNER_OS build yet"; exit 1 ;;
        esac
        if [ -z "$VERSION" ] && [[ "$ACTION_REF" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          VERSION="$ACTION_REF"
        fi
        dir="$RUNNER_TEMP/pathsok"
        rm -rf "$dir"
        # No tag argument means the latest release.
        gh release download $VERSION -R azerv1/pathsok -p "$asset" -D "$dir"
        cd "$dir"
        case "$RUNNER_OS" in
          Linux) tar -xzf pathsok-*.tar.gz ;;
          Windows) unzip -q pathsok-*.zip ;;
        esac

    # Run by absolute path: adding pathsok to PATH would change the PATH it checks.
    - name: Run pathsok
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -f
        exe="$RUNNER_TEMP/pathsok/pathsok"
        [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
        "$exe" $ARGS
