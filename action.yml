name: clisok
description: "Check PATH entries, launchers, libraries and headless tool startup."
branding:
  icon: check-circle
  color: green

inputs:
  version:
    description: "Release tag to use; defaults to the action ref when versioned, otherwise latest."
    default: ""
  args:
    description: "Arguments split on whitespace, e.g. check --output-format github."
    default: check
  assets-directory:
    description: "Use a pre-downloaded release directory; its checksum is still required."
    default: ""

runs:
  using: composite
  steps:
    - name: Download and verify clisok
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
        ASSETS_DIRECTORY: ${{ inputs.assets-directory }}
      run: |
        arguments=()
        if [ -n "$ASSETS_DIRECTORY" ]; then
          arguments+=(--assets "$ASSETS_DIRECTORY")
        fi
        python "$ACTION_PATH/tools/action_install.py" "${arguments[@]}"
    - name: Run clisok
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
      run: |
        set -f
        # Whitespace splitting is the documented input format; shell operators remain ordinary arguments.
        # shellcheck disable=SC2086
        "$CLISOK_EXE" $ARGS
