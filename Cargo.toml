[package]
name = "clisok"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Check PATH entries, executable dependencies, launchers, and headless tool startup."
authors = ["azerv1"]
license = "GPL-3.0-or-later"
repository = "https://github.com/azerv1/clisok"
readme = "README.md"
keywords = ["cli", "path", "diagnostics"]
categories = ["command-line-utilities", "development-tools"]
publish = false
include = ["src/**", "tests/**/*.rs", "tests/fixtures/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
object = { version = "0.40.0", default-features = false, features = ["read_core", "pe", "elf", "std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
flate2 = "1.1.10"
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Pipes", "Win32_System_StationsAndDesktops", "Win32_Graphics_Gdi", "Win32_System_Diagnostics_Debug", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Storage_Packaging_Appx", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bench]]
name = "parsing"
harness = false

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
