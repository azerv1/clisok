[package]
name = "clisok-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
clisok = { path = ".." }

[[bin]]
name = "config_expansion"
path = "fuzz_targets/config_expansion.rs"
test = false
doc = false
bench = false

[[bin]]
name = "python_entry"
path = "fuzz_targets/python_entry.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
